[platformio]
default_envs = ttgo_t_display

[env:ttgo_t_display]
build_src_filter = +<*> -<mic_test.cpp>
platform = espressif32@6.5.0
board = lilygo-t-display
framework = arduino
monitor_speed = 115200
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  bblanchon/ArduinoJson@6.21.5
board_build.embed_txtfiles = data/cert/openrouter-roots.pem
build_flags =
  -D USER_SETUP_LOADED=1
  -D ST7789_DRIVER=1
  -D CGRAM_OFFSET=1
  -D TFT_SDA_READ=1
  -D TFT_WIDTH=135
  -D TFT_HEIGHT=240
  -D TFT_MOSI=19
  -D TFT_SCLK=18
  -D TFT_CS=5
  -D TFT_DC=16
  -D TFT_RST=23
  -D TFT_BL=4
  -D TFT_BACKLIGHT_ON=1
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D SPI_FREQUENCY=40000000

[env:mic_test]
extends = env:ttgo_t_display
build_src_filter = -<*> +<mic_test.cpp>
